name: JamBeacon mobile test builds

on:
  push:
    branches: [android-play-store-prep]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          result=${PIPESTATUS[1]}
          set -o pipefail
          test "$result" -eq 0
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare native project
        run: bash scripts/prepare-android.sh
      - name: Verify target SDK
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('android/variables.gradle').read_text()
          m = re.search(r'targetSdkVersion\s*=\s*(\d+)', s)
          assert m and int(m.group(1)) >= 36, 'Target SDK must be at least 36'
          PY
      - name: Build debug APK and unsigned release bundle
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug bundleRelease
      - name: Upload build artifacts (not production signed)
        uses: actions/upload-artifact@v4
        with:
          name: jambeacon-android-test
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare iOS project
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @capacitor/core@8 @capacitor/cli@8 @capacitor/ios@8
          npm run build
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          /usr/libexec/PlistBuddy -c 'Add :NSMicrophoneUsageDescription string JamBeacon uses your microphone to record your Jam Shack takes.' ios/App/App/Info.plist
      - name: Build for the iPhone simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: ditto -c -k --keepParent ios-build/Build/Products/Debug-iphonesimulator/App.app JamBeacon-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jambeacon-ios-simulator
          path: JamBeacon-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
